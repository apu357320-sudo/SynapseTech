<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurar administrador | Hospital de Clínicas</title>
    <link rel="stylesheet" href="estilo/style.css">
  </head>
  <body>
    <header>
      <a href="index.html" class="enlace-logo" aria-label="Ir a la página inicial"><img src="logo.svg" alt="Logo del Hospital de Clínicas" class="logo"></a>
      <div>
        <h1>Hospital de Clínicas Dr. Manuel Quintela</h1>
        <p>Configuración inicial</p>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Crear primer administrador</h2>
        <p>Completa los datos para habilitar el acceso al sistema.</p>

        <form id="formularioAdministrador" class="formulario">
          <label for="numeroId">C.I.</label>
          <input id="numeroId" name="numeroId" autocomplete="username" inputmode="numeric" maxlength="8" placeholder="Sin puntos ni guion" required>

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>

          <label for="nombreCompleto">Nombre completo</label>
          <input id="nombreCompleto" name="nombre_completo" autocomplete="name" required>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required>

          <button type="submit" class="boton-principal">Crear el administrador</button>
          <p id="mensajeAdministrador" class="mensaje" role="alert"></p>
        </form>

        <a href="index.html" class="boton-secundario">Volver al inicio</a>
      </section>
    </main>

    <script src="js/configurarAdmin.js"></script>
  </body>
</html>
