<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurar administrador | HR Clínica</title>
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body>
    <header>
      <h1>HR Clínica</h1>
      <p>Configuración inicial</p>
    </header>

    <main>
      <section class="panel">
        <h2>Crear primer administrador</h2>
        <p>Completá los datos para habilitar el acceso al sistema.</p>

        <form id="formularioAdministrador" class="formulario">
          <label for="numeroId">C.I.</label>
          <input id="numeroId" name="numeroId" autocomplete="username" required>

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>

          <label for="nombreCompleto">Nombre completo</label>
          <input id="nombreCompleto" name="nombre_completo" autocomplete="name" required>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required>

          <button type="submit" class="btn btn-primary">Crear el administrador</button>
          <p id="mensajeAdministrador" class="mensaje" role="alert"></p>
        </form>

        <a href="index.html" class="btn btn-outline-secondary mt-2">Volver al inicio</a>
      </section>
    </main>

    <script src="js/configurarAdmin.js"></script>
  </body>
</html>
